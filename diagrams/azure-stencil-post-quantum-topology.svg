<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .bg { fill: #0a1128; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; fill: #94a3b8; }
      .enclave { fill: #0f1b3d; stroke: #38bdf8; stroke-width: 2.5; rx: 14; }
      .enclave-ai { fill: #16163a; stroke: #c084fc; stroke-width: 2.5; rx: 14; }
      .enclave-hsm { fill: #0d262b; stroke: #14b8a6; stroke-width: 2.5; rx: 14; }
      .node { fill: #162447; stroke: #0ea5e9; stroke-width: 2; rx: 10; }
      .node-ai { fill: #1f1b4d; stroke: #c084fc; stroke-width: 2; rx: 10; }
      .node-ok { fill: #0d2e26; stroke: #10b981; stroke-width: 2; rx: 10; }
      .node-veto { fill: #3b0d1d; stroke: #fb7185; stroke-width: 2; rx: 10; }
      .lbl-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #38bdf8; }
      .lbl-ai { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #c084fc; }
      .lbl-hsm { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #2dd4bf; }
      .txt-main { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #f1f5f9; }
      .txt-sub { font-family: 'Consolas', monospace; font-size: 14px; fill: #94a3b8; }
      .line-blue { stroke: #38bdf8; stroke-width: 3; fill: none; marker-end: url(#a-blue); }
      .line-purple { stroke: #c084fc; stroke-width: 3; fill: none; marker-end: url(#a-purple); }
      .line-green { stroke: #10b981; stroke-width: 3; fill: none; marker-end: url(#a-green); }
      .line-red { stroke: #fb7185; stroke-width: 3; stroke-dasharray: 7 5; fill: none; marker-end: url(#a-red); }
    </style>
    <marker id="a-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c084fc"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#10b981"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fb7185"/></marker>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <text x="60" y="65" class="title">Post-Quantum Cryptography Migration: Edge TLS vs Key Vault Topology</text>
  <text x="60" y="98" class="subtitle">CycloneDX CBOM 1.6 • AI HNDL Risk Prioritiser • Edge TLS 1.3 X25519MLKEM768 (MTU 1500) • Key Vault REST P90D</text>

  <!-- Left: Edge Transit & SymCrypt -->
  <rect class="enclave" x="60" y="140" width="520" height="620"/>
  <text x="85" y="180" class="lbl-hdr">TRANSIT LAYER: EDGE TLS 1.3 HYBRID PROXY</text>
  <text x="85" y="205" class="txt-sub">Defends Against Passive Harvest-Now-Decrypt-Later (HNDL)</text>

  <rect class="node-ok" x="90" y="235" width="460" height="140"/>
  <text x="110" y="270" class="txt-main">Edge TLS Proxy / Windows SymCrypt</text>
  <text x="110" y="298" class="txt-sub">• TLS 1.3 + X25519MLKEM768 (NIST FIPS 203)</text>
  <text x="110" y="322" class="txt-sub">• ClientHello KeyShare: ~1,216 bytes</text>
  <text x="110" y="346" class="txt-sub">• Terminates HNDL capture at public ingress</text>

  <rect class="node" x="90" y="405" width="460" height="145"/>
  <text x="110" y="440" class="txt-main">Path MTU Probe (Test-TlsMtuFragmentation.ps1)</text>
  <text x="110" y="468" class="txt-sub">• Path MTU: 1500B (MSS = 1460B)</text>
  <text x="110" y="492" class="txt-sub">• Single-Packet ClientHello: 1,441B &lt;= 1,460B</text>
  <text x="110" y="516" class="txt-sub">• Flags PMTU blackholes on &lt; 1480B tunnels</text>

  <rect class="node-veto" x="90" y="580" width="460" height="150"/>
  <text x="110" y="615" class="txt-main">Transit Veto Boundary</text>
  <text x="110" y="643" class="txt-sub">• TLS 1.0 / 1.1 / 1.2 on &gt;= 10yr retention data</text>
  <text x="110" y="668" class="txt-sub">• Emits HNDL_TRANSIT_EXPOSURE</text>
  <text x="110" y="693" class="txt-sub">• Enforced via policies/enforce-tls13-minimum.json</text>

  <!-- Center: CBOM & AI Prioritiser & Graph -->
  <rect class="enclave-ai" x="630" y="140" width="640" height="620"/>
  <text x="660" y="180" class="lbl-ai">AI CBOM RISK PRIORITISER &amp; GRAPH CISO BRIEFING</text>
  <text x="660" y="205" class="txt-sub">CycloneDX CBOM 1.6 • Mosca's Theorem: (Migration + Retention) &gt; 10y</text>

  <rect class="node-ai" x="660" y="235" width="580" height="185"/>
  <text x="680" y="270" class="txt-main">ai/Invoke-CbomRiskPrioritiser.ps1</text>
  <text x="680" y="298" class="txt-sub">• Weights: Quantum Alg (0.40) + Mosca (0.30) +</text>
  <text x="680" y="320" class="txt-sub">  Public Exposure (0.20) + Legacy TLS (0.10)</text>
  <text x="680" y="345" class="txt-sub">• Wave 1 (&gt;= 0.80): 30-Day Immediate Remediation</text>
  <text x="680" y="368" class="txt-sub">• Wave 2 (&gt;= 0.55): Q1 90-Day | Wave 3: 180-Day</text>
  <text x="680" y="392" class="txt-sub">• Abstains if retentionYears == 0 (missing tag)</text>

  <rect class="node" x="660" y="450" width="580" height="130"/>
  <text x="680" y="485" class="txt-main">Readiness Gate (Test-KeyVaultPostQuantumReadiness.ps1)</text>
  <text x="680" y="513" class="txt-sub">• Rejects RSA &lt; 3072-bit on &gt; 5yr retention tiers</text>
  <text x="680" y="538" class="txt-sub">• Rejects missing &lt;= 90-day rotationPolicy</text>

  <rect class="node-ok" x="660" y="605" width="580" height="125"/>
  <text x="680" y="640" class="txt-main">graph/Send-CisoCbomBriefing.ps1</text>
  <text x="680" y="668" class="txt-sub">• POST /v1.0/teams/{teamId}/channels/{channelId}/messages</text>
  <text x="680" y="693" class="txt-sub">• Executive CISO Adaptive Card + SharePoint Compliance Log</text>

  <!-- Right: Azure Key Vault / Managed HSM -->
  <rect class="enclave-hsm" x="1320" y="140" width="540" height="620"/>
  <text x="1350" y="180" class="lbl-hsm">AT-REST LAYER: KEY VAULT &amp; MANAGED HSM</text>
  <text x="1350" y="205" class="txt-sub">Classical Transitional Hardening + Automated Rotation</text>

  <rect class="node-ok" x="1350" y="235" width="480" height="175"/>
  <text x="1370" y="270" class="txt-main">Invoke-KeyVaultPqcRotation.ps1 (REST 7.5)</text>
  <text x="1370" y="298" class="txt-sub">PUT /keys/{key}/rotationpolicy?api-version=7.5</text>
  <text x="1370" y="322" class="txt-sub">• timeAfterCreate: P90D (Auto-Rotate)</text>
  <text x="1370" y="346" class="txt-sub">• timeBeforeExpiry: P30D (Notify)</text>
  <text x="1370" y="370" class="txt-sub">• Target Key: RSA-HSM-4096 (Transitional Floor)</text>

  <rect class="node" x="1350" y="440" width="480" height="140"/>
  <text x="1370" y="475" class="txt-main">Azure Policy Key Size Guardrail</text>
  <text x="1370" y="503" class="txt-sub">policies/audit-legacy-rsa-key-sizes.json</text>
  <text x="1370" y="528" class="txt-sub">Denies Microsoft.KeyVault/vaults/keys &lt; 3072 bits</text>
  <text x="1370" y="553" class="txt-sub">Zero Bicep/Terraform • 100% Invoke-AzRestMethod</text>

  <rect class="node" x="1350" y="610" width="480" height="120"/>
  <text x="1370" y="645" class="txt-main">KQL Cipher &amp; Rotation Audit</text>
  <text x="1370" y="673" class="txt-sub">queries/KeyVault-Cipher-Audit.kql</text>
  <text x="1370" y="698" class="txt-sub">Tracks KeyVaultData &amp; TLS 1.2 legacy handshakes</text>

  <!-- Footer -->
  <rect class="node" x="60" y="800" width="1800" height="210"/>
  <text x="90" y="840" class="lbl-hdr">ARCHITECTURAL HONESTY: TRANSIT HYBRID PQC VS AT-REST KEY VAULT</text>
  <text x="90" y="878" class="txt-main">1. Transit First: Hybrid ML-KEM (X25519MLKEM768) is enforced at Edge TLS 1.3 proxies / SymCrypt to defeat passive HNDL capture today.</text>
  <text x="90" y="913" class="txt-main">2. Key Vault Reality: Native Azure Key Vault / Managed HSM hardens classical keys (RSA-HSM-4096 + P90D rotationPolicy) for crypto-agility.</text>
  <text x="90" y="948" class="txt-main">3. AI Prioritisation: CycloneDX CBOM 1.6 scoring ensures Wave 1 budgets target long-retention, public-facing assets first.</text>
  <text x="90" y="983" class="txt-sub">PowerShell 7.4+ • Invoke-AzRestMethod • Microsoft Graph v2.x • Pester 6.x Verified</text>

