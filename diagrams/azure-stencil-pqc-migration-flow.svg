<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .bg { fill: #0a1128; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; fill: #94a3b8; }
      .actor { fill: #162447; stroke: #38bdf8; stroke-width: 2.5; rx: 10; }
      .actor-ai { fill: #1f1b4d; stroke: #c084fc; stroke-width: 2.5; rx: 10; }
      .actor-graph { fill: #0d2e26; stroke: #10b981; stroke-width: 2.5; rx: 10; }
      .lifeline { stroke: #334155; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .msg-box { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 8; }
      .gate-box { fill: #2a183b; stroke: #c084fc; stroke-width: 2; rx: 8; }
      .ok-box { fill: #0d2e26; stroke: #10b981; stroke-width: 2; rx: 8; }
      .txt-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .txt-sub { font-family: 'Consolas', monospace; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
      .txt-step { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #e2e8f0; }
      .txt-code { font-family: 'Consolas', monospace; font-size: 13px; fill: #38bdf8; }
      .arrow-blue { stroke: #38bdf8; stroke-width: 3; fill: none; marker-end: url(#m-blue); }
      .arrow-purple { stroke: #c084fc; stroke-width: 3; fill: none; marker-end: url(#m-purple); }
      .arrow-green { stroke: #10b981; stroke-width: 3; fill: none; marker-end: url(#m-green); }
    </style>
    <marker id="m-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="m-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c084fc"/></marker>
    <marker id="m-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#10b981"/></marker>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <text x="60" y="65" class="title">Post-Quantum CBOM Prioritisation, Rotation &amp; MTU Probe Sequence</text>
  <text x="60" y="98" class="subtitle">CBOM Inventory -&gt; Mosca HNDL Scorer -&gt; Graph v2.x CISO Briefing -&gt; Key Vault P90D Rotation -&gt; TLS 1.3 MTU 1500 Probe</text>

  <!-- 5 Lifelines -->
  <rect class="actor" x="80" y="135" width="260" height="75"/>
  <text x="210" y="168" class="txt-hdr">CycloneDX CBOM</text>
  <text x="210" y="192" class="txt-sub">estate-crypto-inventory.json</text>
  <line class="lifeline" x1="210" y1="210" x2="210" y2="990"/>

  <rect class="actor-ai" x="440" y="135" width="280" height="75"/>
  <text x="580" y="168" class="txt-hdr">AI HNDL Prioritiser</text>
  <text x="580" y="192" class="txt-sub">Invoke-CbomRiskPrioritiser.ps1</text>
  <line class="lifeline" x1="580" y1="210" x2="580" y2="990"/>

  <rect class="actor-graph" x="830" y="135" width="270" height="75"/>
  <text x="965" y="168" class="txt-hdr">Graph v2.x CISO</text>
  <text x="965" y="192" class="txt-sub">Send-CisoCbomBriefing.ps1</text>
  <line class="lifeline" x1="965" y1="210" x2="965" y2="990"/>

  <rect class="actor" x="1210" y="135" width="270" height="75"/>
  <text x="1345" y="168" class="txt-hdr">Key Vault REST 7.5</text>
  <text x="1345" y="192" class="txt-sub">Invoke-KeyVaultPqcRotation.ps1</text>
  <line class="lifeline" x1="1345" y1="210" x2="1345" y2="990"/>

  <rect class="actor" x="1590" y="135" width="250" height="75"/>
  <text x="1715" y="168" class="txt-hdr">Edge TLS MTU Probe</text>
  <text x="1715" y="192" class="txt-sub">Test-TlsMtuFragmentation.ps1</text>
  <line class="lifeline" x1="1715" y1="210" x2="1715" y2="990"/>

  <!-- Step 1 -->
  <path class="arrow-purple" d="M 210 270 L 570 270"/>
  <rect class="msg-box" x="240" y="235" width="305" height="30"/>
  <text x="255" y="255" class="txt-step">1. Ingest CBOM Assets &amp; Retention Tags</text>

  <!-- Step 2: AI Box -->
  <rect class="gate-box" x="400" y="305" width="360" height="125"/>
  <text x="420" y="335" class="txt-step">2. Mosca Theorem &amp; Wave Scoring:</text>
  <text x="420" y="360" class="txt-code">• (Migration + Retention) &gt; 10y -&gt; HNDL Risk</text>
  <text x="420" y="383" class="txt-code">• Score &gt;= 0.80 -&gt; WAVE_1_IMMEDIATE_30D</text>
  <text x="420" y="406" class="txt-code">• Retention == 0 -&gt; ABSTAIN_VERIFY_TAG</text>

  <!-- Step 3 -->
  <path class="arrow-green" d="M 580 485 L 955 485"/>
  <rect class="msg-box" x="615" y="450" width="315" height="30"/>
  <text x="630" y="470" class="txt-step">3. POST Teams CISO Briefing + SharePoint</text>

  <!-- Step 4 -->
  <path class="arrow-blue" d="M 580 590 L 1335 590"/>
  <rect class="msg-box" x="780" y="555" width="365" height="30"/>
  <text x="795" y="575" class="txt-step">4. PUT /keys/{key}/rotationpolicy (P90D)</text>

  <!-- Step 5 -->
  <rect class="ok-box" x="1185" y="625" width="320" height="90"/>
  <text x="1205" y="655" class="txt-step">5. Key Vault Hardening:</text>
  <text x="1205" y="680" class="txt-code">• RSA-HSM-4096 Transitional Floor</text>
  <text x="1205" y="702" class="txt-code">• POST /keys/{key}/rotate</text>

  <!-- Step 6 -->
  <path class="arrow-blue" d="M 1345 775 L 1705 775"/>
  <rect class="msg-box" x="1375" y="740" width="305" height="30"/>
  <text x="1390" y="760" class="txt-step">6. Probe X25519MLKEM768 ClientHello</text>

  <!-- Step 7 -->
  <rect class="ok-box" x="1555" y="810" width="320" height="95"/>
  <text x="1575" y="840" class="txt-step">7. Path MTU 1500 Validation:</text>
  <text x="1575" y="865" class="txt-code">• ClientHello 1,441B &lt;= 1,460B MSS</text>
  <text x="1575" y="888" class="txt-code">• SAFE_SINGLE_PACKET_CLIENTHELLO</text>
</svg>
